<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <title>Offline · KernelMiners</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070707;
        --surface: #121212;
        --line: #242424;
        --fg: #f5f5f5;
        --muted: #9a9a9a;
        --accent: #ff6a00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 90% at 50% 0%, rgba(255, 106, 0, 0.16), transparent 60%), var(--bg);
        color: var(--fg);
        font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 22px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
      }
      img { width: 76px; height: 76px; border-radius: 20px; }
      h1 { margin: 18px 0 6px; font-size: 20px; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      button {
        margin-top: 20px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff6a00, #ffc600);
        color: #070707;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { filter: brightness(0.94); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="KernelMiners" />
      <h1>You are offline</h1>
      <p>KernelMiners needs a connection to sync your balance. Reconnect and try again — nothing was lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
